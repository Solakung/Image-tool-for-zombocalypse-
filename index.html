<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ตัวแปลงภาพ Zombocalypse</title>
<style>
body{font-family:system-ui,sans-serif;background:#14171c;color:#e8e8e8;margin:0;padding:16px;max-width:560px;margin:auto;line-height:1.5}
h1{font-size:20px;color:#e8a33d}button,select,label.f{font-size:16px;padding:12px 14px;border-radius:10px;border:0;margin:4px 0;background:#e8a33d;color:#111;font-weight:700;width:100%;box-sizing:border-box;display:block;text-align:center}
select{background:#222a33;color:#eee}button.g{background:#2b333d;color:#eee}
.row{display:flex;gap:10px;align-items:center;background:#1d232b;border-radius:10px;padding:8px;margin:6px 0}
.row img{width:56px;height:56px;object-fit:cover;border-radius:8px;background:#000}.row b{display:block;font-size:14px}.row small{color:#9aa}
p.n{color:#9aa;font-size:13px}input[type=file]{display:none}
</style></head><body>
<h1>🧟 ตัวแปลงภาพ → WebP</h1>
<p class="n">ทำงานในเครื่องคุณทั้งหมด ไม่อัปโหลดไปไหน</p>
<select id="grp"><option value="npc">กลุ่ม NPC (12 ภาพ: มิรา 7 + เคน 5)</option><option value="boss">กลุ่มบอสโซน (9 ภาพ)</option><option value="wb">กลุ่มบอสโลก (6 ภาพ)</option><option value="zone">กลุ่มหัวโซน (10 ภาพ)</option></select>
<p class="n" id="need"></p>
<label class="f">① เลือกภาพจากเครื่อง (เลือกหลายภาพพร้อมกัน)<input id="pick" type="file" accept="image/*" multiple></label>
<select id="sort"><option value="time">เรียงตามเวลาที่ไฟล์ถูกสร้าง (เก่า→ใหม่)</option><option value="name">เรียงตามชื่อไฟล์</option></select>
<div id="list"></div>
<button id="go" class="g" disabled>② แปลงและดาวน์โหลดทั้งหมด</button>
<p class="n" id="msg"></p>
<script>
const G={
 npc:{w:512,h:512,top:true,names:["mira_calm","mira_smirk","mira_smile","mira_sad","mira_tired","mira_angry","mira_shock","kane_calm","kane_angry","kane_shock","kane_smile","kane_tired"]},
 boss:{w:768,h:400,names:["ruins","mall","hospital","police","forest","factory","port","base","tunnel"]},
 wb:{w:768,h:400,names:["hungry","mad","king","mutant","tyrant","horde"]},
 zone:{w:800,h:300,names:["safe","ruins","mall","hospital","police","forest","factory","port","base","tunnel"]}};
const $=i=>document.getElementById(i);let files=[];
function sorted(){const a=[...files];a.sort($('sort').value==='name'?(x,y)=>x.name.localeCompare(y.name,undefined,{numeric:true}):(x,y)=>x.lastModified-y.lastModified);return a}
function render(){const g=G[$('grp').value];$('need').textContent=`ต้องการ ${g.names.length} ภาพ ตามลำดับ: ${g.names.join(", ")} · ขนาดปลายทาง ${g.w}×${g.h}`;
 const l=$('list');l.textContent='';sorted().forEach((f,i)=>{const r=document.createElement('div');r.className='row';const im=new Image();im.src=URL.createObjectURL(f);const d=document.createElement('div');
  d.innerHTML=`<b>${i<g.names.length?g.names[i]+'.webp':'⚠ เกินจำนวน (ข้าม)'}</b><small>${f.name}</small>`;r.append(im,d);l.append(r)});
 $('go').disabled=!files.length;$('msg').textContent=files.length&&files.length!==g.names.length?`เลือก ${files.length} ภาพ แต่กลุ่มนี้ต้องการ ${g.names.length} — จะจับคู่ตามลำดับเท่าที่มี ตรวจชื่อด้านบนให้ถูกก่อน`:''}
$('grp').onchange=render;$('sort').onchange=render;$('pick').onchange=e=>{files=[...e.target.files];render()};
function conv(f,g){return new Promise((ok,bad)=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas');c.width=g.w;c.height=g.h;const x=c.getContext('2d');
 const r=Math.max(g.w/im.width,g.h/im.height),w=im.width*r,h=im.height*r;x.imageSmoothingQuality='high';x.drawImage(im,(g.w-w)/2,g.top?0:(g.h-h)/2,w,h);
 const tryQ=q=>c.toBlob(b=>{if(!b)return bad('เบราว์เซอร์นี้ไม่รองรับ WebP');if(b.size>150000&&q>0.6)return tryQ(q-0.1);ok(b)},'image/webp',q);tryQ(0.82)};im.onerror=()=>bad('เปิดภาพไม่ได้: '+f.name);im.src=URL.createObjectURL(f)})}
$('go').onclick=async()=>{const g=G[$('grp').value],fs=sorted();$('go').disabled=true;let log='';
 for(let i=0;i<Math.min(fs.length,g.names.length);i++){try{const b=await conv(fs[i],g);const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=g.names[i]+'.webp';document.body.append(a);a.click();a.remove();
  log+=`✓ ${g.names[i]}.webp ${Math.round(b.size/1024)} KB\n`;$('msg').style.whiteSpace='pre';$('msg').textContent=log;await new Promise(r=>setTimeout(r,500))}catch(e){log+=`✗ ${g.names[i]}: ${e}\n`;$('msg').textContent=log}}
 $('msg').textContent=log+'\nเสร็จ — ไฟล์อยู่ในโฟลเดอร์ Downloads ของเครื่อง';$('go').disabled=false};
render();
</script></body></html>
